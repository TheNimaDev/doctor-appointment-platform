<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Account Action</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div class="container">

    <div id="loading" class="card">
      <div class="header">
        <h1>Loading...</h1>
        <p>Please wait.</p>
      </div>
    </div>

    <div id="error" class="card hidden">
      <div class="header">
        <h1>Invalid Request</h1>
        <p id="errorMessage"></p>
      </div>
    </div>

    <div id="reset-password" class="card hidden">

      <div class="header">
        <h1>Reset Your Password</h1>

        <p>
          Enter your new password below.
        </p>
      </div>

      <form id="resetPasswordForm">

        <div class="field">
          <label for="newPassword">
            New Password
          </label>

          <input type="password" id="newPassword" minlength="8" maxlength="255" required>
        </div>

        <div class="field">
          <label for="confirmPassword">
            Confirm Password
          </label>

          <input type="password" id="confirmPassword" minlength="8" maxlength="255" required>
        </div>

        <p id="resetMessage" class="message"></p>

        <button type="submit">
          Reset Password
        </button>

      </form>

    </div>

    <div id="verify-email" class="card hidden">

      <div class="header">
        <h1>Verify Your Email</h1>

        <p>
          Click the button below to verify your email address.
        </p>
      </div>

      <p id="verifyMessage" class="message"></p>

      <button id="verifyEmailButton">
        Verify Email
      </button>

    </div>

  </div>

  <script src="./script.js"></script>

</body>

</html>
